[package]
name = "ghostvault"
version = "0.2.0"
edition = "2021"
description = "Spending vault for AI agents: every spend must carry a NEAR AI TEE-signed decision"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "5.1.0", features = ["unstable"] }

[dev-dependencies]
near-sdk = { version = "5.1.0", features = ["unit-testing", "unstable"] }
secp256k1 = { version = "0.27", features = ["recovery"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
